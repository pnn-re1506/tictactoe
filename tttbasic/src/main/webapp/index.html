<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TicTacToe</title>
  <style>
    body { text-align: center; }
    #board { margin: 20px auto; }
    #board td { width: 100px; height: 100px; font-size: 2rem; cursor: pointer; text-align: center; vertical-align: middle; }
  </style>
</head>
<body>

<h1>Tic-Tac-Toe</h1>
<p>You = X &nbsp;|&nbsp; Computer = O</p>

<p id="status">Press "New Game" to start.</p>
<p id="error" style="display:none"></p>

<table border="1" cellpadding="10" cellspacing="0" id="board">
  <tr>
    <td id="c1" onclick="makeMove(1)"></td>
    <td id="c2" onclick="makeMove(2)"></td>
    <td id="c3" onclick="makeMove(3)"></td>
  </tr>
  <tr>
    <td id="c4" onclick="makeMove(4)"></td>
    <td id="c5" onclick="makeMove(5)"></td>
    <td id="c6" onclick="makeMove(6)"></td>
  </tr>
  <tr>
    <td id="c7" onclick="makeMove(7)"></td>
    <td id="c8" onclick="makeMove(8)"></td>
    <td id="c9" onclick="makeMove(9)"></td>
  </tr>
</table>

<br>
<button onclick="startGame()">New Game</button>

<script>
  // Path tương đối: tự động resolve theo context path Tomcat (ví dụ /tttbasic/api/move)
  const API = 'api/move';

  let board = null;
  let gameOver = true;

  function renderBoard() {
    for (let i = 1; i <= 9; i++) {
      const td = document.getElementById('c' + i);
      const val = board[i - 1];
      td.textContent = val === 1 ? 'X' : val === 2 ? 'O' : '';
    }
  }

  function setStatus(msg) {
    document.getElementById('status').textContent = msg;
  }

  function showError(msg) {
    const el = document.getElementById('error');
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3000);
  }

  function startGame() {
    board = [0,0,0,0,0,0,0,0,0];
    gameOver = false;
    document.getElementById('error').style.display = 'none';
    renderBoard();
    setStatus('Your turn!');
  }

  async function makeMove(cell) {
    if (!board) return;
    if (gameOver) { showError('Press "New Game" to start again.'); return; }
    if (board[cell - 1] !== 0) { showError('Cell already occupied!'); return; }

    let res;
    try {
      const response = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ board, cell })
      });
      res = await response.json();
      if (!response.ok) { showError(res.error || 'Error'); return; }
    } catch (e) {
      showError('Cannot reach server on port 8080.');
      return;
    }

    board = res.board;
    renderBoard();

    if (res.status === 'WIN_PLAYER')   { setStatus('You win!');        gameOver = true; }
    else if (res.status === 'WIN_COMPUTER') { setStatus('Computer wins!'); gameOver = true; }
    else if (res.status === 'DRAW')    { setStatus("It's a draw!");    gameOver = true; }
    else setStatus('Your turn!');
  }
</script>

</body>
</html>
